[project]
name = "halyard"
version = "0.1.0"
description = "Brand knowledge graph and intelligence agents (Brewbird deployment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "neo4j>=5.20,<6",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
halyard = "halyard.cli:main"

[dependency-groups]
dev = [
    "pandas>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Neo4j (make up)"]

[tool.ruff]
line-length = 100
target-version = "py311"
