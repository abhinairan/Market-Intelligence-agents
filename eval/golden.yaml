# The twelve golden questions, word for word from the brief, and the agent each goes to.
# P5 adds the expected answers, computed by the oracle independently of the agents.
questions:
  - {id: Q1, agent: consumer, question: "How many unique, genuine conversations about Brewbird were there between 17 August and 4 October, broken down by product line?"}
  - {id: Q2, agent: consumer, question: "Week by week, how has sentiment toward Brewbird Nitro moved, and how does that compare with the brand overall?"}
  - {id: Q3, agent: consumer, question: "What were the top complaint categories in the last three weeks, using our codes, with two example mentions each?"}
  - {id: Q4, agent: consumer, question: "Is anything going wrong that the brand-level numbers are hiding?"}
  - {id: Q5, agent: consumer, question: "What happened on 22 September?"}
  - {id: Q6, agent: consumer, question: "How many of the people complaining about Nitro have cancelled their subscription?"}
  - {id: Q7, agent: competitor, question: "What did Saltmarsh launch, when, and what does it cost per can compared with ours?"}
  - {id: Q8, agent: competitor, question: "Is Saltmarsh's \"half the price\" claim accurate?"}
  - {id: Q9, agent: competitor, question: "What is our share of voice against Saltmarsh, Bluepeak and Filterhaus over the last four weeks? Say exactly how you counted."}
  - {id: Q10, agent: competitor, question: "Has any competitor changed its shipping terms? When?"}
  - {id: Q11, agent: competitor, question: "What does Filterhaus charge cafés wholesale?"}
  - {id: Q12, agent: competitor, question: "Did Saltmarsh's launch cause the fall in Nitro sentiment?"}
